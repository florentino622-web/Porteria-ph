<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portería · Control de Acceso</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#161B26">

<meta name="apple-mobile-web-app-title" content="Portería">
<style>
  :root{
    --bg: #161B26;
    --surface: #1F2635;
    --surface-2: #262E40;
    --line: #333D54;
    --text: #EAEDF5;
    --text-dim: #9AA4BC;
    --text-faint: #6B7590;
    --accent: #4FD1A5;
    --accent-dim: #2C6B54;
    --warn: #F0AA5C;
    --warn-dim: #6E4F26;
    --danger: #EF6C7E;
    --danger-dim: #6E2F3A;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

  body{

    background-size: cover;
    background-position: center top;
    background-repeat: no-repeat;
    background-attachment: fixed;
    min-height: 100vh;
    color:var(--text);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:720px;margin:0 auto;padding:18px 16px 60px;}

  .masthead{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding-bottom:14px;
    margin-bottom:18px;
    border-bottom:1px solid var(--line);
  }
  .masthead h1{
    font-size:19px;
    font-weight:650;
    letter-spacing:-0.01em;
    margin:0;
    text-shadow: 0 1px 8px rgba(0,0,0,0.55);
  }
  .masthead .sub{
    font-size:12px;
    color:var(--text-faint);
    font-family:var(--mono);
    text-shadow: 0 1px 6px rgba(0,0,0,0.5);
  }

  /* Tabs */
  .tabs{display:flex;gap:4px;margin-bottom:18px;background:var(--surface);padding:4px;border-radius:10px;}
  .tab{
    flex:1;text-align:center;padding:9px 8px;border-radius:7px;
    font-size:13.5px;font-weight:600;color:var(--text-dim);cursor:pointer;
    border:none;background:transparent;font-family:var(--sans);
  }
  .tab.active{background:var(--surface-2);color:var(--text);}

  section{display:none;}
  section.active{display:block;}

  /* --- Verificación --- */
  .verify-box{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px;
  }
  .verify-box label{
    display:block;font-size:12px;color:var(--text-faint);margin-bottom:6px;
  }
  .verify-row{display:flex;gap:8px;}
  .verify-row input{
    flex:1;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:9px;
    padding:12px 12px;
    color:var(--text);
    font-family:var(--mono);
    font-size:16px;
    letter-spacing:0.02em;
  }
  .verify-row input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .verify-row button{
    background:var(--accent);
    color:#0B1712;
    border:none;
    border-radius:9px;
    padding:0 18px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
  .verify-row button:active{transform:translateY(1px);}
  .btn-qr{
    background:var(--surface-2);
    color:var(--text);
    border:1px solid var(--line);
    border-radius:9px;
    padding:0 16px;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
  }

  .scan-sheet{
    background:var(--surface);width:100%;max-width:720px;border-radius:18px 18px 0 0;
    padding:16px 16px 22px;
  }
  .scan-head{
    display:flex;justify-content:space-between;align-items:center;
    font-size:14px;font-weight:650;margin-bottom:12px;
  }
  .scan-close{
    background:none;border:none;color:var(--text-faint);font-size:13px;font-weight:600;cursor:pointer;
  }
  .scan-frame{
    position:relative;width:100%;aspect-ratio:1/1;border-radius:14px;overflow:hidden;
    background:#000;
  }
  .scan-frame video{width:100%;height:100%;object-fit:cover;}
  .scan-guide{
    position:absolute;inset:14%;border:2px solid var(--accent);border-radius:16px;
    box-shadow:0 0 0 999px rgba(0,0,0,0.35);
  }
  .scan-hint{text-align:center;color:var(--text-faint);font-size:12.5px;margin-top:12px;}
  .btn-capture{
    width:100%;margin-top:14px;padding:13px;border-radius:9px;border:none;
    background:var(--accent);color:#0B1712;font-weight:700;font-size:14.5px;cursor:pointer;
  }

  .result{margin-top:16px;border-radius:12px;padding:16px;border:1px solid var(--line);}
  .result.ok{background:rgba(79,209,165,0.09);border-color:var(--accent-dim);}
  .result.warn{background:rgba(240,170,92,0.09);border-color:var(--warn-dim);}
  .result.bad{background:rgba(239,108,126,0.09);border-color:var(--danger-dim);}
  .result-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .result-photo{
    width:56px;height:56px;border-radius:12px;object-fit:cover;flex-shrink:0;
    border:2px solid var(--line);
  }
  .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .result.ok .dot{background:var(--accent);}
  .result.warn .dot{background:var(--warn);}
  .result.bad .dot{background:var(--danger);}
  .result-title{font-size:16px;font-weight:700;}
  .result.ok .result-title{color:var(--accent);}
  .result.warn .result-title{color:var(--warn);}
  .result.bad .result-title{color:var(--danger);}
  .result-grid{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;}
  .result-grid dt{color:var(--text-faint);}
  .result-grid dd{margin:0;font-family:var(--mono);}

  .empty-hint{color:var(--text-faint);font-size:13px;text-align:center;padding:30px 10px;}

  /* --- Registro / lista --- */
  .toolbar{display:flex;gap:8px;margin-bottom:14px;}
  .toolbar input{
    flex:1;background:var(--surface);border:1px solid var(--line);
    border-radius:9px;padding:10px 12px;color:var(--text);font-size:14px;font-family:var(--sans);
  }
  .btn-add{
    background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    border-radius:9px;padding:0 16px;font-weight:600;font-size:14px;cursor:pointer;
  }
  .import-row{display:flex;gap:8px;margin-bottom:14px;}
  .btn-import, .btn-template{
    flex:1;background:none;border:1px dashed var(--line);color:var(--text-dim);
    border-radius:9px;padding:9px 10px;font-size:12.5px;font-weight:600;cursor:pointer;
  }
  .btn-import:hover, .btn-template:hover{color:var(--text);border-color:var(--text-faint);}
  #importSummary{margin-bottom:10px;}
  .import-report{
    background:var(--surface);border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;font-size:13px;margin-bottom:10px;
  }
  .import-report .line{display:flex;justify-content:space-between;margin-bottom:3px;}
  .import-report .line.ok-line{color:var(--accent);}
  .import-report .line.err-line{color:var(--danger);}
  .import-report ul{margin:6px 0 0;padding-left:18px;color:var(--text-faint);font-size:12px;max-height:100px;overflow-y:auto;}

  .person-card{
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:13px 14px;margin-bottom:9px;
  }
  .person-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .person-left{display:flex;gap:11px;align-items:flex-start;min-width:0;}
  .avatar{
    width:42px;height:42px;border-radius:10px;flex-shrink:0;object-fit:cover;
    background:var(--surface-2);border:1px solid var(--line);
  }
  .avatar-placeholder{
    width:42px;height:42px;border-radius:10px;flex-shrink:0;
    background:var(--surface-2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:700;color:var(--text-faint);
  }
  .person-name{font-weight:650;font-size:15px;}
  .person-meta{font-size:12.5px;color:var(--text-dim);margin-top:2px;font-family:var(--mono);}
  .badge{
    font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;
  }
  .badge.inquilino{background:rgba(79,209,165,0.15);color:var(--accent);}
  .badge.visitante{background:rgba(240,170,92,0.15);color:var(--warn);}
  .person-dates{font-size:12px;color:var(--text-faint);margin-top:8px;font-family:var(--mono);}
  .person-actions{display:flex;gap:14px;margin-top:10px;}
  .person-actions button{
    background:none;border:none;color:var(--text-faint);font-size:12.5px;
    cursor:pointer;padding:0;font-family:var(--sans);font-weight:600;
  }
  .person-actions button:hover{color:var(--text);}
  .person-actions button.danger:hover{color:var(--danger);}

  /* --- Modal --- */
  .overlay{
    display:none;position:fixed;inset:0;background:rgba(10,12,18,0.7);
    align-items:flex-end;justify-content:center;z-index:20;
  }
  .overlay.open{display:flex;}
  .sheet{
    background:var(--surface);width:100%;max-width:720px;border-radius:18px 18px 0 0;
    padding:20px 18px 26px;max-height:88vh;overflow-y:auto;
  }
  .sheet h2{margin:0 0 16px;font-size:17px;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12px;color:var(--text-faint);margin-bottom:5px;}
  .field input, .field select{
    width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;
    padding:10px 11px;color:var(--text);font-size:14.5px;font-family:var(--sans);
  }
  .field input[type=text].mono, .field input[type=number]{font-family:var(--mono);}
  .type-toggle{display:flex;gap:8px;}
  .type-toggle button{
    flex:1;padding:11px;border-radius:8px;border:1px solid var(--line);background:var(--bg);
    color:var(--text-dim);font-weight:650;font-size:14px;cursor:pointer;
  }
  .type-toggle button.sel-inquilino{border-color:var(--accent);color:var(--accent);background:rgba(79,209,165,0.08);}
  .type-toggle button.sel-visitante{border-color:var(--warn);color:var(--warn);background:rgba(240,170,92,0.08);}

  .photo-field{display:flex;align-items:center;gap:14px;}
  .photo-preview{
    width:64px;height:64px;border-radius:12px;object-fit:cover;flex-shrink:0;
    background:var(--bg);border:1px solid var(--line);
  }
  .photo-placeholder{
    width:64px;height:64px;border-radius:12px;flex-shrink:0;
    background:var(--bg);border:1px dashed var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:11px;color:var(--text-faint);text-align:center;
  }
  .photo-buttons{display:flex;gap:8px;flex-wrap:wrap;}
  .photo-buttons button{
    background:var(--bg);border:1px solid var(--line);color:var(--text-dim);
    border-radius:8px;padding:8px 12px;font-size:12.5px;font-weight:600;cursor:pointer;
  }
  .photo-buttons button.remove{color:var(--danger);}
  .date-row{display:flex;gap:10px;}
  .date-row .field{flex:1;}
  .sheet-actions{display:flex;gap:10px;margin-top:18px;}
  .sheet-actions button{
    flex:1;padding:13px;border-radius:9px;font-weight:700;font-size:14.5px;border:none;cursor:pointer;
  }
  .btn-save{background:var(--accent);color:#0B1712;}
  .btn-cancel{background:var(--surface-2);color:var(--text-dim);}
  .err{color:var(--danger);font-size:12.5px;margin-top:4px;display:none;}
  .err.show{display:block;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    padding:10px 18px;border-radius:20px;font-size:13.5px;opacity:0;pointer-events:none;
    transition:opacity 0.25s;z-index:30;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div id="app">
  <div class="masthead">
    <h1>Portería <span style="font-size:11px;font-weight:600;color:#F0A868;vertical-align:middle;">🌴 v-playa1</span></h1>
    <span class="sub" id="totalCount">— registros</span>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="verify">Verificar</button>
    <button class="tab" data-tab="list">Registro</button>
  </div>

  <section id="tab-verify" class="active">
    <div class="verify-box">
      <label for="verifyInput">Cédula de la persona en la puerta</label>
      <div class="verify-row">
        <input id="verifyInput" type="text" inputmode="numeric" placeholder="Ej. 1023456789" autocomplete="off">
        <button id="scanQrBtn" class="btn-qr" title="Escanear QR">QR</button>
        <button id="verifyBtn">Verificar</button>
      </div>
    </div>
    <div id="verifyResult"></div>
  </section>

  <section id="tab-list">
    <div class="toolbar">
      <input id="searchInput" type="text" placeholder="Buscar por nombre, cédula o apto">
      <button class="btn-add" id="openAddBtn">+ Nuevo</button>
    </div>
    <div class="import-row">
      <button class="btn-import" id="openImportBtn">Importar Excel / CSV</button>
      <button class="btn-template" id="downloadTemplateBtn">Descargar plantilla</button>
    </div>
    <input type="file" id="fileInput" accept=".csv,.xlsx,.xls" style="display:none;">
    <div id="importSummary"></div>
    <div id="listContainer"></div>
  </section>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <h2 id="sheetTitle">Nuevo registro</h2>
    <div class="field">
      <label>Tipo</label>
      <div class="type-toggle">
        <button type="button" id="btnInquilino">Inquilino</button>
        <button type="button" id="btnVisitante">Visitante</button>
      </div>
    </div>

<script>
const STORAGE_KEY = 'registro-personas';
let people = [];
let editingCedula = null;
let currentType = 'inquilino';
let currentPhoto = null;

const $ = (id) => document.getElementById(id);

function todayISO(){ return new Date().toISOString().slice(0,10); }

async function loadPeople(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    people = raw ? JSON.parse(raw) : [];
  }catch(e){
    people = [];
  }
  renderList();
  updateCount();
}

async function savePeople(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(people));
  }catch(e){
    showToast('No se pudo guardar. Intenta de nuevo.');
  }
}

function updateCount(){
  $('totalCount').textContent = people.length + (people.length === 1 ? ' registro' : ' registros');
}

function showToast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

// ---- Tabs ----
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));
    tab.classList.add('active');
    $('tab-'+tab.dataset.tab).classList.add('active');
  });
});

// ---- Verificación ----
function estadoVisitante(p){
  const hoy = todayISO();
  if(p.fecha_inicio && hoy < p.fecha_inicio) return 'upcoming';
  if(p.fecha_fin && hoy > p.fecha_fin) return 'expired';
  return 'active';
}

function runVerify(){
  const raw = $('verifyInput').value.trim();
  const box = $('verifyResult');
  if(!raw){ box.innerHTML=''; return; }
  const p = people.find(x=>x.cedula === raw);
  if(!p){
    box.innerHTML = `
      <div class="result bad">
        <div class="result-head"><div class="dot"></div><div class="result-title">No encontrado</div></div>
        <div class="result-grid">
          <dt>Cédula</dt><dd>${escapeHtml(raw)}</dd>
        </div>
      </div>`;
    return;
  }
  if(p.tipo === 'inquilino'){
    box.innerHTML = `
      <div class="result ok">
        <div class="result-head">
          ${p.foto ? `<img class="result-photo" src="${p.foto}" alt="">` : `<div class="dot"></div>`}
          <div class="result-title">Inquilino — acceso permitido</div>
        </div>
        <div class="result-grid">
          <dt>Nombre</dt><dd>${escapeHtml(p.nombre)}</dd>
          <dt>Apartamento</dt><dd>${escapeHtml(p.apartamento)}</dd>
          <dt>Cédula</dt><dd>${escapeHtml(p.cedula)}</dd>
        </div>
      </div>`;
    return;
  }
  // visitante
  const st = estadoVisitante(p);
  let cls, titulo;
  if(st === 'active'){ cls='ok'; titulo='Visitante — estadía vigente'; }
  else if(st === 'upcoming'){ cls='warn'; titulo='Visitante — la estadía aún no inicia'; }
  else { cls='bad'; titulo='Período de su estadía venció. ¡Gracias por su visita!'; }
  box.innerHTML = `
    <div class="result ${cls}">
      <div class="result-head">
        ${p.foto ? `<img class="result-photo" src="${p.foto}" alt="">` : `<div class="dot"></div>`}
        <div class="result-title">${titulo}</div>
      </div>
      <div class="result-grid">
        <dt>Nombre</dt><dd>${escapeHtml(p.nombre)}</dd>
        <dt>Visita a apto</dt><dd>${escapeHtml(p.apartamento)}</dd>
        <dt>Cédula</dt><dd>${escapeHtml(p.cedula)}</dd>
        <dt>Desde</dt><dd>${fmtDate(p.fecha_inicio)}</dd>
        <dt>Hasta</dt><dd>${fmtDate(p.fecha_fin)}</dd>
      </div>
    </div>`;
}

$('verifyBtn').addEventListener('click', runVerify);
$('verifyInput').addEventListener('keydown', e=>{ if(e.key==='Enter') runVerify(); });
$('verifyInput').addEventListener('input', ()=>{ if(!$('verifyInput').value.trim()) $('verifyResult').innerHTML=''; });

// ---- Escaneo QR ----
let qrStream = null;
let qrRafId = null;

function extractCedula(text){
  const digits = String(text).match(/\d{5,}/);
  return digits ? digits[0] : String(text).trim();
}

async function openQrScanner(){
  $('scanHint').textContent = 'Apunta al código QR del visitante';
  $('qrOverlay').classList.add('open');
  try{
    qrStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }
    });
    const video = $('qrVideo');
    video.srcObject = qrStream;
    await video.play();
    qrRafId = requestAnimationFrame(scanFrame);
  }catch(err){
    $('scanHint').textContent = 'No se pudo acceder a la cámara. Revisa los permisos del navegador.';
  }
}

function scanFrame(){
  const video = $('qrVideo');
  const canvas = $('qrCanvas');
  if(video.readyState === video.HAVE_ENOUGH_DATA){
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = window.jsQR ? jsQR(imageData.data, imageData.width, imageData.height) : null;
    if(code && code.data){
      const cedula = extractCedula(code.data);
      $('verifyInput').value = cedula;
      closeQrScanner();
      runVerify();
      return;
    }
  }
  qrRafId = requestAnimationFrame(scanFrame);
}

function closeQrScanner(){
  $('qrOverlay').classList.remove('open');
  if(qrRafId) cancelAnimationFrame(qrRafId);
  qrRafId = null;
  if(qrStream){
    qrStream.getTracks().forEach(t => t.stop());
    qrStream = null;
  }
}

$('scanQrBtn').addEventListener('click', openQrScanner);
$('qrCloseBtn').addEventListener('click', closeQrScanner);
$('qrOverlay').addEventListener('click', (e)=>{ if(e.target === $('qrOverlay')) closeQrScanner(); });

function fmtDate(d){
  if(!d) return '—';
  const [y,m,day] = d.split('-');
  return `${day}/${m}/${y}`;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function iniciales(nombre){
  return String(nombre).trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
}

// ---- Foto ----
function setPhotoPreview(dataUrl){
  currentPhoto = dataUrl;
  const img = $('photoPreview');
  const placeholder = $('photoPlaceholder');
  const removeBtn = $('removePhotoBtn');
  if(dataUrl){
    img.src = dataUrl;
    img.style.display = 'block';
    placeholder.style.display = 'none';
    removeBtn.style.display = 'inline-block';
  }else{
    img.style.display = 'none';
    placeholder.style.display = 'flex';
    removeBtn.style.display = 'none';
  }
}

function compressImage(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('No se pudo leer la imagen.'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Imagen inválida.'));
      img.onload = () => {
        const MAX = 300;
        let { width, height } = img;
        if(width > height && width > MAX){ height = Math.round(height * MAX / width); width = MAX; }
        else if(height > MAX){ width = Math.round(width * MAX / height); height = MAX; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function handlePhotoFile(e){
  const file = e.target.files[0];
  if(!file) return;
  try{
    const compressed = await compressImage(file);
    setPhotoPreview(compressed);
  }catch(err){
    showToast('No se pudo procesar la foto.');
  }
  e.target.value = '';
}

$('takePhotoBtn').addEventListener('click', openPhotoCamera);
$('pickPhotoBtn').addEventListener('click', ()=> $('photoGallery').click());
$('photoGallery').addEventListener('change', handlePhotoFile);
$('removePhotoBtn').addEventListener('click', ()=> setPhotoPreview(null));

// ---- Cámara en vivo para foto de perfil ----
let photoStream = null;

async function openPhotoCamera(){
  $('photoHint').textContent = 'Encuadra el rostro y toca "Capturar"';
  $('photoOverlay').classList.add('open');
  try{
    photoStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }
    });
    const video = $('photoVideo');
    video.srcObject = photoStream;
    await video.play();
  }catch(err){
    $('photoHint').textContent = 'No se pudo acceder a la cámara. Revisa los permisos del navegador.';
  }
}

function closePhotoCamera(){
  $('photoOverlay').classList.remove('open');
  if(photoStream){
    photoStream.getTracks().forEach(t => t.stop());
    photoStream = null;
  }
}

function capturePhotoFromCamera(){
  const video = $('photoVideo');
  if(!video.videoWidth){ return; }
  const MAX = 300;
  let width = video.videoWidth, height = video.videoHeight;
  if(width > height && width > MAX){ height = Math.round(height * MAX / width); width = MAX; }
  else if(height > MAX){ width = Math.round(width * MAX / height); height = MAX; }
  const canvas = $('photoCanvas');
  canvas.width = width; canvas.height = height;
  canvas.getContext('2d').drawImage(video, 0, 0, width, height);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
  setPhotoPreview(dataUrl);
  closePhotoCamera();
}

$('capturePhotoBtn').addEventListener('click', capturePhotoFromCamera);
$('photoCloseBtn').addEventListener('click', closePhotoCamera);
$('photoOverlay').addEventListener('click', (e)=>{ if(e.target === $('photoOverlay')) closePhotoCamera(); });

// ---- Lista / registro ----
function renderList(){
  const q = ($('searchInput').value || '').toLowerCase().trim();
  const container = $('listContainer');
  const filtered = people.filter(p=>{
    if(!q) return true;
    return p.nombre.toLowerCase().includes(q) || p.cedula.includes(q) || p.apartamento.toLowerCase().includes(q);
  }).sort((a,b)=> a.nombre.localeCompare(b.nombre));

  if(filtered.length === 0){
    container.innerHTML = `<div class="empty-hint">${people.length===0 ? 'Aún no hay personas registradas. Toca "+ Nuevo" para agregar la primera.' : 'Nada coincide con esa búsqueda.'}</div>`;
    return;
  }

  container.innerHTML = filtered.map(p=>{
    const badge = p.tipo === 'inquilino'
      ? `<span class="badge inquilino">Inquilino</span>`
      : `<span class="badge visitante">Visitante</span>`;
    const dates = p.tipo === 'visitante'
      ? `<div class="person-dates">Estadía: ${fmtDate(p.fecha_inicio)} → ${fmtDate(p.fecha_fin)}</div>`
      : '';
    const avatar = p.foto
      ? `<img class="avatar" src="${p.foto}" alt="">`
      : `<div class="avatar-placeholder">${escapeHtml(iniciales(p.nombre))}</div>`;
    return `
      <div class="person-card">
        <div class="person-top">
          <div class="person-left">
            ${avatar}
            <div>
              <div class="person-name">${escapeHtml(p.nombre)}</div>
              <div class="person-meta">CC ${escapeHtml(p.cedula)} · Apto ${escapeHtml(p.apartamento)}</div>
            </div>
          </div>
          ${badge}
        </div>
        ${dates}
        <div class="person-actions">
          <button data-edit="${escapeHtml(p.cedula)}">Editar</button>
          <button class="danger" data-del="${escapeHtml(p.cedula)}">Eliminar</button>
        </div>
      </div>`;
  }).join('');

  container.querySelectorAll('[data-edit]').forEach(b=>{
    b.addEventListener('click', ()=>openEdit(b.dataset.edit));
  });
  container.querySelectorAll('[data-del]').forEach(b=>{
    b.addEventListener('click', ()=>deletePerson(b.dataset.del));
  });
}

$('searchInput').addEventListener('input', renderList);

async function deletePerson(cedula){
  people = people.filter(p=>p.cedula !== cedula);
  await savePeople();
  renderList();
  updateCount();
  showToast('Registro eliminado.');
}

// ---- Modal ----
function setType(type){
  currentType = type;
  $('btnInquilino').classList.toggle('sel-inquilino', type==='inquilino');
  $('btnVisitante').classList.toggle('sel-visitante', type==='visitante');

$('btnInquilino').addEventListener('click', ()=>setType('inquilino'));
$('btnVisitante').addEventListener('click', ()=>setType('visitante'));

function openAdd(){
  editingCedula = null;
  $('sheetTitle').textContent = 'Nuevo registro';
  $('fNombre').value = '';
  $('fCedula').value = '';
  $('fCedula').removeAttribute('disabled');
  $('fApto').value = '';
  $('fInicio').value = todayISO();
  $('fFin').value = '';
  setPhotoPreview(null);
  clearErrors();
  setType('inquilino');
  $('overlay').classList.add('open');
}

function openEdit(cedula){
  const p = people.find(x=>x.cedula === cedula);
  if(!p) return;
  editingCedula = cedula;
  $('sheetTitle').textContent = 'Editar registro';
  $('fNombre').value = p.nombre;
  $('fCedula').value = p.cedula;
  $('fCedula').setAttribute('disabled','disabled');
  $('fApto').value = p.apartamento;
  $('fInicio').value = p.fecha_inicio || todayISO();
  $('fFin').value = p.fecha_fin || '';
  setPhotoPreview(p.foto || null);
  clearErrors();
  setType(p.tipo);
  $('overlay').classList.add('open');
}

function closeSheet(){
  $('overlay').classList.remove('open');
  closePhotoCamera();
}

$('openAddBtn').addEventListener('click', openAdd);
$('cancelBtn').addEventListener('click', closeSheet);
$('overlay').addEventListener('click', (e)=>{ if(e.target === $('overlay')) closeSheet(); });

function clearErrors(){
  ['errNombre','errCedula','errApto','errFechas'].forEach(id=>$(id).classList.remove('show'));
}

$('saveBtn').addEventListener('click', async ()=>{
  clearErrors();
  const nombre = $('fNombre').value.trim();
  const cedula = $('fCedula').value.trim();
  const apto = $('fApto').value.trim();
  const inicio = $('fInicio').value;
  const fin = $('fFin').value;

  let hasError = false;
  if(!nombre){ $('errNombre').classList.add('show'); hasError = true; }
  if(!cedula){ $('errCedula').classList.add('show'); hasError = true; }
  if(!apto){ $('errApto').classList.add('show'); hasError = true; }
  if(currentType === 'visitante' && inicio && fin && fin < inicio){
    $('errFechas').classList.add('show'); hasError = true;
  }
  // duplicate cedula check on add
  if(!editingCedula && people.some(p=>p.cedula === cedula)){
    $('errCedula').textContent = 'Ya existe un registro con esta cédula.';
    $('errCedula').classList.add('show');
    hasError = true;
  }
  if(hasError) return;

  const record = {
    cedula,
    nombre,
    apartamento: apto,
    tipo: currentType,
    fecha_inicio: currentType === 'visitante' ? (inicio || todayISO()) : null,
    fecha_fin: currentType === 'visitante' ? (fin || null) : null,
    foto: currentPhoto || null
  };

  if(editingCedula){
    const idx = people.findIndex(p=>p.cedula === editingCedula);
    if(idx > -1) people[idx] = record;
  } else {
    people.push(record);
  }
  await savePeople();
  renderList();
  updateCount();
  closeSheet();
  showToast(editingCedula ? 'Registro actualizado.' : 'Registro creado.');
});

// ---- Importar Excel / CSV ----
function normalizeKey(k){
  return String(k).toLowerCase().trim()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'') // quita tildes
    .replace(/[\s._-]+/g,'');
}

const KEY_MAP = {
  cedula: 'cedula', cc: 'cedula', identificacion: 'cedula', numerodeidentificacion:'cedula',
  nombre: 'nombre', nombrecompleto: 'nombre',
  apartamento: 'apartamento', apto: 'apartamento', apartamentonumero:'apartamento', numeroapartamento:'apartamento',
  tipo: 'tipo', categoria: 'tipo',
  fechainicio: 'fecha_inicio', inicio: 'fecha_inicio', fechadeinicio:'fecha_inicio', fechainiciodeestadia:'fecha_inicio',
  fechafin: 'fecha_fin', fin: 'fecha_fin', fechadefin:'fecha_fin', fechafindeestadia:'fecha_fin', fechafinal:'fecha_fin'
};

function toISODate(value){
  if(!value && value !== 0) return null;
  if(value instanceof Date && !isNaN(value)){
    return value.toISOString().slice(0,10);
  }
  const s = String(value).trim();
  if(!s) return null;
  // ya viene como YYYY-MM-DD
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  // formato DD/MM/YYYY o DD-MM-YYYY
  const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(m){
    const [_, d, mo, y] = m;
    return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`;
  }
  return null;
}

function normalizeTipo(value){
  const s = normalizeKey(value || '');
  if(['visitante','invitado','visita'].includes(s)) return 'visitante';
  if(['inquilino','residente','propietario'].includes(s)) return 'inquilino';
  return null;
}

$('openImportBtn').addEventListener('click', ()=> $('fileInput').click());

$('fileInput').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  try{
    const data = await file.arrayBuffer();
    const workbook = XLSX.read(data, {type:'array', cellDates:true});
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
    processImportedRows(rows);
  }catch(err){
    showToast('No se pudo leer el archivo.');
  }
  $('fileInput').value = '';
});

async function processImportedRows(rows){
  let added = 0, updated = 0;
  const errores = [];

  rows.forEach((row, i) => {
    const mapped = {};
    Object.keys(row).forEach(rawKey=>{
      const norm = normalizeKey(rawKey);
      const field = KEY_MAP[norm];
      if(field) mapped[field] = row[rawKey];
    });

    const nombre = String(mapped.nombre || '').trim();
    const cedula = String(mapped.cedula || '').trim();
    const apartamento = String(mapped.apartamento || '').trim();
    const tipo = normalizeTipo(mapped.tipo) || 'inquilino';

    const fila = i + 2; // +2 porque la fila 1 es el encabezado
    if(!nombre || !cedula || !apartamento){
      errores.push(`Fila ${fila}: falta nombre, cédula o apartamento.`);
      return;
    }

    const idx = people.findIndex(p=>p.cedula === cedula);
    const record = {
      cedula,
      nombre,
      apartamento,
      tipo,
      fecha_inicio: tipo === 'visitante' ? (toISODate(mapped.fecha_inicio) || todayISO()) : null,
      fecha_fin: tipo === 'visitante' ? toISODate(mapped.fecha_fin) : null,
      foto: idx > -1 ? (people[idx].foto || null) : null
    };

    if(idx > -1){ people[idx] = record; updated++; }
    else { people.push(record); added++; }
  });

  if(added + updated > 0){
    await savePeople();
    renderList();
    updateCount();
  }
  renderImportSummary(added, updated, errores);
}

function renderImportSummary(added, updated, errores){
  const box = $('importSummary');
  const errList = errores.length
    ? `<ul>${errores.slice(0,8).map(e=>`<li>${escapeHtml(e)}</li>`).join('')}${errores.length>8 ? `<li>y ${errores.length-8} más...</li>` : ''}</ul>`
    : '';
  box.innerHTML = `
    <div class="import-report">
      <div class="line ok-line"><span>Agregados</span><span>${added}</span></div>
      <div class="line ok-line"><span>Actualizados</span><span>${updated}</span></div>
      ${errores.length ? `<div class="line err-line"><span>Con error</span><span>${errores.length}</span></div>${errList}` : ''}
    </div>`;
}

$('downloadTemplateBtn').addEventListener('click', ()=>{
  const csv = 'cedula,nombre,apartamento,tipo,fecha_inicio,fecha_fin\n' +
    '1023456789,Juana Pérez,502,inquilino,,\n' +
    '1099887766,Carlos Gómez,301,visitante,2026-09-15,2026-09-20\n';
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'plantilla-registro-ph.csv';
  document.body.appendChild(a);

});

  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
